<style>
  /* ---------- Tokens (mêmes que la home + ceux des pages projet) ---------- */
  :root{
    color-scheme:light dark;
    --bg:#FAFAFA;
    --ink:#09090B;
    --muted:#52525B;
    --faint:#71717A;
    --fig-n:#A1A1AA;
    --nav-bg:rgba(244,244,245,0.55);
    --nav-brd:rgba(0,0,0,0.06);
    --nav-ink:#27272A;
    --accent:#FDCF00;
    --shadow:0 10px 30px rgba(24,24,27,0.06);
    --card-brd:rgba(9,9,11,0.08);
    /* page projet */
    --page:#FFFFFF;
    --soft:#FAFAFA;
    --panel:#F4F4F5;
    --chip-bg:#F4F4F5;
    --chip-ink:#3F3F46;
    --card-shadow:0 0.6px 0.6px -1.25px rgba(0,0,0,.18), 0 2.3px 2.3px -2.5px rgba(0,0,0,.16), 0 10px 10px -3.75px rgba(0,0,0,.06);
    /* couleur du projet : Connect Station = ambre (même teinte que sa carte sur la home) */
    --pj:#B45309;
    --pj-tint:rgba(245,158,11,0.07);
    --pj-tint2:rgba(245,158,11,0.14);
    --hz1:rgba(254,243,199,0.70);   /* horizon du hero */
    --hz2:rgba(252,211,77,0.45);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0A0A0B; --ink:#FAFAFA; --muted:#A1A1AA; --faint:#8B8B93; --fig-n:#71717A;
      --nav-bg:rgba(39,39,42,0.55); --nav-brd:rgba(255,255,255,0.08); --nav-ink:#E4E4E7;
      --shadow:0 10px 30px rgba(0,0,0,0.4); --card-brd:rgba(255,255,255,0.09);
      --page:#0E0E11; --soft:#16161A; --panel:#1C1C21; --chip-bg:#232329; --chip-ink:#D4D4D8;
      --card-shadow:0 0 0 1px rgba(255,255,255,.05);
      --pj:#FBBF24; --pj-tint:rgba(251,191,36,0.06); --pj-tint2:rgba(251,191,36,0.12);
      --hz1:rgba(120,53,15,0.28); --hz2:rgba(180,83,9,0.22);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0A0A0B; --ink:#FAFAFA; --muted:#A1A1AA; --faint:#8B8B93; --fig-n:#71717A;
    --nav-bg:rgba(39,39,42,0.55); --nav-brd:rgba(255,255,255,0.08); --nav-ink:#E4E4E7;
    --shadow:0 10px 30px rgba(0,0,0,0.4); --card-brd:rgba(255,255,255,0.09);
    --page:#0E0E11; --soft:#16161A; --panel:#1C1C21; --chip-bg:#232329; --chip-ink:#D4D4D8;
    --card-shadow:0 0 0 1px rgba(255,255,255,.05);
    --pj:#FBBF24; --pj-tint:rgba(251,191,36,0.06); --pj-tint2:rgba(251,191,36,0.12);
    --hz1:rgba(120,53,15,0.28); --hz2:rgba(180,83,9,0.22);
  }

  *{box-sizing:border-box}
  img{max-width:100%}
  [hidden]{display:none!important}
  body{
    margin:0;
    background:var(--page);
    color:var(--ink);
    font-family:"Geist","Geist Placeholder",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  .serif{ font-family:"Newsreader","PP Editorial New",Georgia,"Times New Roman",serif; font-weight:200; }

  /* ---------- Barre de progression de lecture ---------- */
  .progress{ position:fixed; top:0; left:0; right:0; height:3px; z-index:9999; pointer-events:none; }
  .progress i{ display:block; height:100%; background:var(--pj); transform-origin:0 50%; transform:scaleX(0); }

  /* ---------- Nav (identique à la home, mais fixée) ---------- */
  .nav-wrap{
    position:fixed; top:calc(18px + env(safe-area-inset-top,0px)); left:0; right:0; z-index:10;
    display:flex; justify-content:center; padding:0 16px; pointer-events:none;
  }
  .nav{ display:flex; align-items:center; gap:8px; pointer-events:auto; }
  .logo{
    width:56px;height:56px;border-radius:50%;
    background:var(--nav-bg); backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border:1px solid var(--nav-brd);
    display:flex;align-items:center;justify-content:center;
    font-weight:600;font-size:15px;color:var(--nav-ink); letter-spacing:0.02em;
    box-shadow:var(--shadow); text-decoration:none;
  }
  .nav-links{
    display:flex;align-items:center;gap:4px;
    background:var(--nav-bg); backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border:1px solid var(--nav-brd); border-radius:28px; padding:8px; box-shadow:var(--shadow);
  }
  .nav-links a{
    display:inline-flex;align-items:center;gap:7px; padding:9px 15px; border-radius:20px;
    font-size:15px;font-weight:500; color:var(--nav-ink); text-decoration:none;
    transition:background .18s ease;
  }
  .nav-links a:hover{background:rgba(0,0,0,0.05)}
  .nav-links a svg{opacity:.85}
  .mail{
    width:56px;height:56px;border-radius:50%; background:var(--accent);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 18px rgba(253,207,0,0.4); text-decoration:none; transition:transform .18s ease;
  }
  .mail:hover{transform:translateY(-2px)}
  .theme-toggle{
    position:fixed; top:calc(18px + env(safe-area-inset-top,0px)); right:calc(16px + env(safe-area-inset-right,0px)); z-index:11;
    width:48px;height:48px;border-radius:50%;
    background:var(--nav-bg); backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border:1px solid var(--nav-brd); box-shadow:var(--shadow);
    display:flex;align-items:center;justify-content:center; color:var(--nav-ink); cursor:pointer; padding:0;
    transition:transform .18s ease;
  }
  .theme-toggle:hover{transform:translateY(-2px)}
  .theme-toggle svg{display:none}
  .theme-toggle .moon{display:block}
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]) .theme-toggle .sun{display:block}
    :root:not([data-theme="light"]) .theme-toggle .moon{display:none}
  }
  :root[data-theme="dark"] .theme-toggle .sun{display:block}
  :root[data-theme="dark"] .theme-toggle .moon{display:none}
  :root[data-theme="light"] .theme-toggle .moon{display:block}
  :root[data-theme="light"] .theme-toggle .sun{display:none}
  a:focus-visible, button:focus-visible{ outline:2px solid var(--ink); outline-offset:3px; }

  /* ---------- Colonnes ---------- */
  .wrap{ width:min(700px, 100% - 40px); margin-inline:auto; }
  .wide{ width:min(1072px, 100% - 32px); margin-inline:auto; }

  /* ---------- Textes ---------- */
  .eyebrow{
    margin:0 0 14px; font-family:"Geist Mono",ui-monospace,monospace; font-size:12px; font-weight:600;
    line-height:1; text-transform:uppercase; letter-spacing:.02em; color:var(--pj);
  }
  .prose p{ margin:0 0 16px; font-size:16px; line-height:24px; color:var(--muted); }
  .prose p:last-child{ margin-bottom:0; }
  .prose b, .prose strong{ color:var(--ink); font-weight:600; }
  .h3{ margin:0 0 24px; font-size:clamp(30px,3vw,40px); line-height:1.2; text-wrap:balance; }
  .h3 em{ font-style:italic; }

  /* ---------- Footer (identique à la home) ---------- */
  .site-footer{
    position:relative; background:var(--ink); color:var(--bg); min-height:74vh;
    padding:clamp(38px,5.5vh,56px) clamp(20px,4vw,64px) clamp(22px,4vh,30px);
    display:flex; flex-direction:column; overflow:hidden; border-radius:48px 48px 0 0;
  }
  .foot-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:24px; }
  .foot-connect{ margin:0; font-size:clamp(16px,1.5vw,19px); line-height:1.55; }
  .foot-socials{ display:flex; gap:12px; flex:none; }
  .foot-socials a{
    width:56px;height:56px;border-radius:50%; display:flex;align-items:center;justify-content:center;
    background:color-mix(in srgb, var(--bg) 8%, transparent); border:1px solid color-mix(in srgb, var(--bg) 16%, transparent);
    color:var(--bg); text-decoration:none; transition:background .18s ease, transform .18s ease;
  }
  .foot-socials a:hover{ background:color-mix(in srgb, var(--bg) 16%, transparent); transform:translateY(-2px); }
  .foot-name{
    margin:auto 0 clamp(12px,2vh,20px); font-family:"Newsreader","PP Editorial New",Georgia,serif; font-weight:200;
    font-size:clamp(52px,17vw,220px); line-height:0.9; letter-spacing:-0.01em; white-space:nowrap;
  }
  .foot-bottom{ display:flex; justify-content:space-between; align-items:center; gap:16px; font-size:14px; color:color-mix(in srgb, var(--bg) 58%, transparent); }


  /* ---------- Playground : canvas infini (mesuré sur xhulia.com/playground) ----------
     Canvas 3000×2400 qu'on fait glisser 1:1, borné aux bords de l'écran avec un rebond élastique ;
     titre fixe au centre, pastille d'aide en bas, cartes inclinées avec ombre douce et légende grise. */
  html, body{ height:100%; }
  body.pg{ overflow:hidden; background:var(--bg); overscroll-behavior:none; }
  .pg-view{ position:fixed; inset:0; overflow:hidden; cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none; outline:none; }
  .pg-view.dragging{ cursor:grabbing; }
  .pg-canvas{ position:absolute; left:0; top:0; width:3000px; height:2400px; will-change:transform; }
  .pg-canvas.settle{ transition:transform .45s cubic-bezier(.2,.8,.2,1); }
  .pg-bg{ position:absolute; inset:0; opacity:.1; background-image:radial-gradient(circle, var(--ink) 1.1px, transparent 1.6px); background-size:25px 25px; pointer-events:none; }

  .pg-desc{ position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:2; text-align:center; pointer-events:none; }
  .pg-desc svg{ color:var(--fig-n); }
  .pg-desc h1{ margin:10px 0 6px; font-size:56px; line-height:67.2px; }
  .pg-desc p{ margin:0 auto; max-width:190px; font-size:14px; line-height:18.2px; color:var(--faint); }
  .pg-hint{
    position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:3;
    display:flex; align-items:center; gap:8px; padding:10px 16px; border-radius:999px; pointer-events:none;
    background:var(--page); box-shadow:0 0 0 1px var(--card-brd), 0 6px 18px rgba(9,9,11,.06);
    font-size:14px; line-height:18.2px; color:var(--nav-ink); white-space:nowrap;
  }

  .it{ position:absolute; transform-origin:50% 50%; }
  .it .card{
    position:relative; border-radius:24px; overflow:hidden; background:#fff;
    box-shadow:0 .6px .6px -1.25px rgba(0,0,0,.22), 0 2.3px 2.3px -2.5px rgba(0,0,0,.19), 0 10px 10px -3.75px rgba(0,0,0,.08), 0 0 0 1px rgba(9,9,11,.04);
  }
  .it.sm .card{ border-radius:16px; }
  .it .card img, .it .card video{ display:block; width:100%; height:auto; pointer-events:none; -webkit-user-drag:none; }
  .it.open .card{ cursor:zoom-in; }
  .it.doc .card{ border-radius:8px; }
  .badge{
    position:absolute; left:10px; top:10px; z-index:1; padding:4px 8px; border-radius:6px; background:#E11D48; color:#fff;
    font:600 11px/1 "Geist Mono",ui-monospace,monospace; letter-spacing:.04em;
  }
  .cap{ margin:14px auto 0; max-width:100%; text-align:center; font-size:14px; line-height:18.2px; color:var(--faint); text-wrap:balance; }
  .cap a{ color:var(--ink); text-decoration:underline; text-underline-offset:3px; white-space:nowrap; }

  /* Visionneuse (image agrandie ou PDF) */
  .lb{ position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center; padding:24px; background:rgba(9,9,11,.72); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  .lb.open{ display:flex; }
  .lb-box{ position:relative; max-width:min(1100px,100%); max-height:100%; display:flex; flex-direction:column; align-items:center; gap:14px; }
  .lb-box img{ max-width:100%; max-height:calc(100vh - 140px); border-radius:16px; display:block; background:#fff; }
  .lb-box iframe{ width:min(900px, calc(100vw - 48px)); height:calc(100vh - 140px); border:0; border-radius:12px; background:#fff; }
  .lb-bar{ display:flex; gap:8px; }
  .lb-bar a, .lb-bar button{
    display:inline-flex; align-items:center; gap:8px; height:44px; padding:0 18px; border:0; border-radius:999px; cursor:pointer;
    background:#fff; color:#09090B; font:500 15px/1 "Geist",system-ui,sans-serif; text-decoration:none;
  }
  .lb-bar button{ width:44px; padding:0; justify-content:center; }

  @media (max-width:768px){
    .pg-desc h1{ font-size:44px; line-height:52px; }
  }
  @media (max-width:768px){
    .nav-wrap{ justify-content:flex-start; padding:0 18px; }
    .nav-links{ padding:6px; gap:2px; }
    .nav-links a span{ display:none; }
    .nav-links a{ padding:11px; }
    .logo,.mail{ width:52px;height:52px; }
    .theme-toggle{ top:auto; bottom:calc(20px + env(safe-area-inset-bottom,0px)); right:16px; width:44px;height:44px; }
  }
  @media (max-width:560px){
    .foot-socials a{ width:46px;height:46px; }
    .foot-name{ font-size:clamp(40px,15vw,96px); }
  }
  @media (prefers-reduced-motion:reduce){
    .mail:hover,.theme-toggle:hover{ transform:none; }
  }
</style>
</head>

<script>
/* thème clair / sombre (même clé que la home) */
(function(){
  var root=document.documentElement;
  try{var s=localStorage.getItem('theme'); if(s==='dark'||s==='light') root.setAttribute('data-theme',s);}catch(e){}
  function current(){var a=root.getAttribute('data-theme'); return a?a:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');}
  document.getElementById('themeToggle').addEventListener('click',function(){
    var next=current()==='dark'?'light':'dark';
    root.setAttribute('data-theme',next);
    try{localStorage.setItem('theme',next);}catch(e){}
  });
})();

/* canvas : glisser 1:1, bornes = bords de l'écran avec rebond élastique (comme l'original),
   + molette / trackpad et flèches du clavier (ajouts pour que le défilement reste naturel) */
(function(){
  var view=document.getElementById('pgView'), cv=document.getElementById('pgCanvas');
  var W=3000, H=2400, x=0, y=0, dragging=false, sx=0, sy=0, ox=0, oy=0, moved=0, downTarget=null;
  function bounds(){ return { minX:Math.min(0,innerWidth-W), minY:Math.min(0,innerHeight-H) }; }
  function rubber(v,min,max){ return v>max ? max+(v-max)*.35 : v<min ? min+(v-min)*.35 : v; }
  function clamp(v,min,max){ return Math.max(min,Math.min(max,v)); }
  function paint(px,py){ cv.style.transform='translate3d('+px+'px,'+py+'px,0)'; }
  function settle(){ var b=bounds(); x=clamp(x,b.minX,0); y=clamp(y,b.minY,0); cv.classList.add('settle'); paint(x,y); setTimeout(function(){ cv.classList.remove('settle'); },460); }
  // départ : canvas centré
  x=(innerWidth-W)/2; y=(innerHeight-H)/2; paint(x,y);

  view.addEventListener('pointerdown',function(e){
    if(e.button!==0 || e.target.closest('a')) return;
    dragging=true; moved=0; sx=e.clientX; sy=e.clientY; ox=x; oy=y; downTarget=e.target;
    cv.classList.remove('settle'); view.classList.add('dragging');
    try{ view.setPointerCapture(e.pointerId); }catch(_){}
  });
  view.addEventListener('pointermove',function(e){
    if(!dragging) return;
    var dx=e.clientX-sx, dy=e.clientY-sy, b=bounds();
    moved=Math.max(moved,Math.abs(dx)+Math.abs(dy));
    x=ox+dx; y=oy+dy; paint(rubber(x,b.minX,0), rubber(y,b.minY,0));
  });
  function end(e){
    if(!dragging) return; dragging=false; view.classList.remove('dragging');
    var b=bounds(); x=rubber(x,b.minX,0); y=rubber(y,b.minY,0); settle();
    if(moved<6 && downTarget) openItem(downTarget.closest('.it'));   // un clic, pas un glisser
    downTarget=null;
  }
  view.addEventListener('pointerup',end);
  view.addEventListener('pointercancel',end);
  view.addEventListener('wheel',function(e){
    e.preventDefault(); var b=bounds();
    x=clamp(x-e.deltaX,b.minX,0); y=clamp(y-e.deltaY,b.minY,0); paint(x,y);
  },{passive:false});
  view.addEventListener('keydown',function(e){
    var s=e.shiftKey?240:80, k=e.key, b=bounds();
    if(k==='ArrowLeft') x+=s; else if(k==='ArrowRight') x-=s; else if(k==='ArrowUp') y+=s; else if(k==='ArrowDown') y-=s; else return;
    e.preventDefault(); x=clamp(x,b.minX,0); y=clamp(y,b.minY,0); cv.classList.add('settle'); paint(x,y);
  });
  addEventListener('resize',settle);
  view.focus({preventScroll:true});

  /* visionneuse : image agrandie, ou PDF intégré (nouvel onglet sur mobile, où les PDF intégrés s'affichent mal) */
  var lb=document.getElementById('lb'), box=document.getElementById('lbBox'), lastFocus=null;
  function closeBtn(){ return '<button type="button" data-close aria-label="Fermer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>'; }
  function openItem(it){
    if(!it) return;
    var pdf=it.getAttribute('data-pdf'), full=it.getAttribute('data-full');
    if(pdf){
      if(innerWidth<768){ window.open(pdf,'_blank','noopener'); return; }
      box.innerHTML='<iframe src="'+pdf+'#view=FitH" title="'+(it.getAttribute('data-title')||'PDF')+'"></iframe>'+
        '<div class="lb-bar"><a href="'+pdf+'" target="_blank" rel="noopener">Ouvrir dans un onglet ↗</a><a href="'+pdf+'" download>Télécharger</a>'+closeBtn()+'</div>';
    } else if(full){
      var alt=(it.querySelector('img')||{}).alt||'';
      box.innerHTML='<img src="'+full+'" alt="'+alt.replace(/"/g,'&quot;')+'"><div class="lb-bar">'+closeBtn()+'</div>';
    } else return;
    lastFocus=document.activeElement; lb.classList.add('open'); box.querySelector('[data-close]').focus();
  }
  function closeLb(){ lb.classList.remove('open'); box.innerHTML=''; if(lastFocus) lastFocus.focus({preventScroll:true}); }
  lb.addEventListener('click',function(e){ if(e.target===lb || e.target.closest('[data-close]')) closeLb(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape' && lb.classList.contains('open')) closeLb(); });
  // le lien « Lire le PDF » ouvre la visionneuse sur ordinateur
  document.querySelectorAll('[data-pdf-link]').forEach(function(a){
    a.addEventListener('click',function(e){ if(innerWidth>=768){ e.preventDefault(); openItem(a.closest('.it')); } });
  });
})();
</script>
